<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="layout (title,head,body)"
      th:with="defaultTheme = ${theme.config.basic?.defaultTheme != null ? theme.config.basic.defaultTheme : 'dark'}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
    <title th:text="${title}"></title>
    <link rel="icon" th:href="${site.favicon}" />
    
    <th:block th:replace="~{gateway_fragments/common::basicStaticResources}"></th:block>
    
    <!-- 暗色模式初始化（必须先于 theme-color-init.js，确保后者读到正确的 data-theme） -->
    <meta name="default-theme" th:content="${defaultTheme}" />
    <script>
      (function() {
        var meta = document.querySelector('meta[name="default-theme"]');
        var defaultTheme = (meta && meta.content) || 'dark';
        var scheme = localStorage.getItem('color-scheme');
        if (!scheme || scheme === 'auto') {
          scheme = defaultTheme;
        }
        document.documentElement.setAttribute('data-theme', scheme);
      })();
    </script>
    
    <script th:inline="javascript">
      window.__ACCENT_LIGHT = /*[[${theme.config.basic?.lightColor != null and !#strings.isEmpty(theme.config.basic.lightColor) ? theme.config.basic.lightColor : '#7DCDE8'}]]*/ '#7DCDE8';
      window.__ACCENT_DARK  = /*[[${theme.config.basic?.darkColor != null and !#strings.isEmpty(theme.config.basic.darkColor) ? theme.config.basic.darkColor : '#E87D98'}]]*/ '#E87D98';
    </script>
    <script th:src="@{/assets/js/theme-color-init.js}"></script>
    
    <link rel="stylesheet" th:href="@{/assets/css/base.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/login.css}" />
    <script th:src="@{/assets/js/gateway-toast.js}" defer></script>
    <script th:inline="javascript">
      (function() {
        var enabled = /*[[${theme.config.basic != null and theme.config.basic.typographyConfig != null and theme.config.basic.typographyConfig.enabled != null ? theme.config.basic.typographyConfig.enabled : false}]]*/ false;
        if (!(enabled === true || enabled === 'true')) return;

        var fontKey = /*[[${theme.config.basic != null and theme.config.basic.typographyConfig != null and theme.config.basic.typographyConfig.globalFont != null ? theme.config.basic.typographyConfig.globalFont : ''}]]*/ '';
        var fontMap = {
          noto_sans_sc: '"Noto Sans SC", sans-serif',
          pingfang_sc: '"PingFang SC", sans-serif',
          microsoft_yahei: '"Microsoft YaHei", sans-serif',
          lxgw_wenkai: '"LXGW WenKai", serif',
          smiley_sans: '"Smiley Sans Oblique", "LXGW WenKai", sans-serif',
          zcool_kuaile: '"ZCOOL KuaiLe", "Comic Sans MS", cursive',
          youyuan: '"YouYuan", "Microsoft YaHei", sans-serif',
          styuanti: '"STYuanti", "PingFang SC", "Microsoft YaHei", sans-serif',
          stkaiti: '"STKaiti", "KaiTi", serif',
          stxingkai: '"STXingkai", "KaiTi", cursive',
          harmonyos_sans_sc: '"HarmonyOS Sans SC", sans-serif',
          misans: '"MiSans", sans-serif',
          inter: '"Inter", sans-serif'
        };

        var resolved = '';
        if (fontKey !== null && fontKey !== undefined) {
          var key = String(fontKey).trim();
          resolved = fontMap[key] || key;
        }
        if (!resolved) return;

        var root = document.documentElement;
        root.style.setProperty('--font-global', resolved);
        root.style.setProperty('--font-sans', resolved);
        root.style.setProperty('--font-serif', resolved);
        root.style.setProperty('--font-rounded', resolved);
        root.style.setProperty('--font-mono', resolved);
      })();
    </script>

    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>
  </head>
  <body>
    <!-- 壁纸背景层（直接读取首页壁纸配置） -->
    <th:block th:if="${theme.config.basic != null && theme.config.basic.loginSettings != null && theme.config.basic.loginSettings.enableGatewayWallpaper != null && theme.config.basic.loginSettings.enableGatewayWallpaper}"
              th:with="hasApi = ${theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundApi != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundApi)}">
      <div class="gateway-wallpaper" id="gateway-wallpaper">
        <th:block th:if="${hasApi}">
          <img class="gateway-wallpaper-img" id="gateway-wallpaper-img" alt=""
               th:data-api="${theme.config.home.backgroundConfig.heroBackgroundApi}"
               th:data-api-mobile="${theme.config.home.backgroundConfig.heroBackgroundApiMobile}"
               th:data-mobile-light="${theme.config.home.backgroundConfig.heroBackgroundLightMobile}"
               th:data-mobile-dark="${theme.config.home.backgroundConfig.heroBackgroundDarkMobile}"
               th:data-mobile-light-url="${theme.config.home.backgroundConfig.heroBackgroundLightMobileUrl}"
               th:data-mobile-dark-url="${theme.config.home.backgroundConfig.heroBackgroundDarkMobileUrl}" />
        </th:block>
        <th:block th:unless="${hasApi}">
          <th:block th:with="legacyBg = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackground != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackground)) ? theme.config.home.backgroundConfig.heroBackground : ''},
                             lightBg = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundLight != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundLight)) ? theme.config.home.backgroundConfig.heroBackgroundLight : (!#strings.isEmpty(legacyBg) ? legacyBg : '/themes/theme-Serenity/assets/public/labixiaoxi.webp')},
                             darkBg = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundDark != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundDark)) ? theme.config.home.backgroundConfig.heroBackgroundDark : (!#strings.isEmpty(legacyBg) ? legacyBg : '/themes/theme-Serenity/assets/public/labixiaoxi.webp')},
                             mobileLightBg = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundLightMobile != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundLightMobile)) ? theme.config.home.backgroundConfig.heroBackgroundLightMobile : ''},
                             mobileDarkBg = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundDarkMobile != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundDarkMobile)) ? theme.config.home.backgroundConfig.heroBackgroundDarkMobile : ''},
                             mobileLightUrl = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundLightMobileUrl != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundLightMobileUrl)) ? theme.config.home.backgroundConfig.heroBackgroundLightMobileUrl : ''},
                             mobileDarkUrl = ${(theme.config.home != null and theme.config.home.backgroundConfig != null and theme.config.home.backgroundConfig.heroBackgroundDarkMobileUrl != null and not #strings.isEmpty(theme.config.home.backgroundConfig.heroBackgroundDarkMobileUrl)) ? theme.config.home.backgroundConfig.heroBackgroundDarkMobileUrl : ''}">
            <img class="gateway-wallpaper-img" id="gateway-wallpaper-img" alt=""
                 th:attr="data-light=${lightBg},data-dark=${darkBg},data-mobile-light=${mobileLightBg},data-mobile-dark=${mobileDarkBg},data-mobile-light-url=${mobileLightUrl},data-mobile-dark-url=${mobileDarkUrl}" />
          </th:block>
        </th:block>
      </div>
      <script>
        (function() {
          var wrap = document.getElementById('gateway-wallpaper');
          if (wrap) document.body.classList.add('has-gateway-wallpaper');
          var img = document.getElementById('gateway-wallpaper-img');
          if (!img) img = document.querySelector('.gateway-wallpaper-img');
          if (!img) return;
          var api = img.getAttribute('data-api');
          if (api) {
            var CACHE_KEY = 'serenity_gw_wallpaper_url';
            var SESSION_KEY = 'serenity_gw_wallpaper_session';
            var cached = sessionStorage.getItem(CACHE_KEY);
            var apiMobile = img.getAttribute('data-api-mobile');
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var mobileLight = img.getAttribute('data-mobile-light-url') || img.getAttribute('data-mobile-light');
            var mobileDark = img.getAttribute('data-mobile-dark-url') || img.getAttribute('data-mobile-dark');
            var initialUrl = cached || ((isMobile && apiMobile) ? apiMobile : api);
            function currentTheme() {
              return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            }
            function mobileUrl() {
              return currentTheme() === 'light' ? mobileLight : mobileDark;
            }
            function currentUrl() {
              return isMobile && mobileUrl() ? mobileUrl() : initialUrl;
            }
            function applyApiWallpaper() {
              var finalUrl = currentUrl();
              if (finalUrl) img.src = finalUrl;
            }
            applyApiWallpaper();
            img.decoding = 'async';
            img.onload = function() {
              img.classList.add('loaded');
              if (!mobileUrl() && !cached && img.src) sessionStorage.setItem(CACHE_KEY, img.src);
            };
            img.onerror = function() {
              var fallback = (isMobile && apiMobile) ? apiMobile : api;
              if (img.src !== fallback) {
                img.src = fallback;
              } else if (cached) {
                sessionStorage.removeItem(CACHE_KEY);
                initialUrl = fallback;
                img.src = fallback;
              } else {
                wrap.style.display = 'none';
                document.body.classList.remove('has-gateway-wallpaper');
              }
            };
            if (window.__gatewayApiWallpaperObserver && typeof window.__gatewayApiWallpaperObserver.disconnect === 'function') {
              window.__gatewayApiWallpaperObserver.disconnect();
            }
            window.__gatewayApiWallpaperObserver = new MutationObserver(function(mutations) {
              for (var i = 0; i < mutations.length; i++) {
                if (mutations[i].attributeName === 'data-theme') {
                  applyApiWallpaper();
                  break;
                }
              }
            });
            window.__gatewayApiWallpaperObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
          } else {
            function isMobileDevice() {
              return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }
            function currentTheme() {
              return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            }
            function mobileUrl(theme) {
              var linked = theme === 'light' ? img.getAttribute('data-mobile-light-url') : img.getAttribute('data-mobile-dark-url');
              var attached = theme === 'light' ? img.getAttribute('data-mobile-light') : img.getAttribute('data-mobile-dark');
              return linked || attached || '';
            }
            function desktopUrl(theme) {
              var selected = theme === 'light' ? img.getAttribute('data-light') : img.getAttribute('data-dark');
              var pure = String(selected || '').split('?')[0].split('#')[0].toLowerCase();
              return pure.endsWith('.mp4') || pure.endsWith('.webm')
                ? '/themes/theme-Serenity/assets/public/labixiaoxi.webp'
                : selected;
            }
            function applyWallpaper() {
              var theme = currentTheme();
              var finalUrl = isMobileDevice() ? (mobileUrl(theme) || desktopUrl(theme)) : desktopUrl(theme);
              if (!finalUrl) return;
              img.src = finalUrl;
              img.classList.add('loaded');
            }
            applyWallpaper();
            if (window.__gatewayWallpaperObserver && typeof window.__gatewayWallpaperObserver.disconnect === 'function') {
              window.__gatewayWallpaperObserver.disconnect();
            }
            window.__gatewayWallpaperObserver = new MutationObserver(function(mutations) {
              for (var i = 0; i < mutations.length; i++) {
                if (mutations[i].attributeName === 'data-theme') {
                  applyWallpaper();
                  break;
                }
              }
            });
            window.__gatewayWallpaperObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
          }
        })();
      </script>
    </th:block>

    <!-- 背景层 -->
    <div class="atmosphere"></div>
    <div class="paper-texture"></div>

    <!-- 返回主页按钮 -->
    <a href="/" class="gateway-home-btn" aria-label="返回主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      <span>返回主页</span>
    </a>

    <!-- 主容器 -->
    <div class="gateway-page">
      <div class="gateway-container glass">

        <!-- 左侧：品牌展示区 -->
        <div class="gateway-brand">
          <div class="brand-bg-glow"></div>

          <div class="brand-top">
            <div class="brand-logo-row">
              <div class="brand-logo-icon">
                <img th:src="${site.logo ?: (site.favicon ?: '/themes/theme-Serenity/assets/public/logo.webp')}"
                     th:alt="${site.title}" alt="Logo" />
              </div>
              <div class="brand-logo-info">
                <span class="brand-logo-text" th:text="${site.title}">Serenity</span>
                <span class="brand-logo-subtitle" th:if="${site.subtitle}" th:text="${site.subtitle}">Grace in every moment</span>
              </div>
            </div>

            <div id="brand-text-area">
              <h1 class="brand-headline" id="brand-headline" th:text="${#strings.contains(title, '退出') ? '暂别，山高水长间。' : (#strings.contains(title, '注册') ? '轻落，如花映水间。' : '归来，恰似风拂檐。')}">归来，恰似风拂檐。</h1>
              <p class="brand-desc" id="brand-desc" th:text="${#strings.contains(title, '退出') ? '短暂的离开，是为了更好的重逢。期待你的再次归来。' : (#strings.contains(title, '注册') ? '在这片宁静之地，留下你温柔的印记。每一个故事，都值得被安放。' : '久别重逢，一切如初。愿这份宁静，与你常在。')}">久别重逢，一切如初。愿这份宁静，与你常在。</p>
            </div>
          </div>

          <div class="brand-bottom">
            <div class="brand-stats-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
              <span th:text="${'Serenity · ' + site.title}">Serenity · 博客</span>
            </div>
          </div>
        </div>

        <!-- 右侧：表单区域 -->
        <div class="gateway-form-area">
          <th:block th:replace="${body}" />
        </div>

      </div>
    </div>

    <!-- ANI 动态鼠标指针 (Hue 定制) -->
    <script th:src="@{/assets/js/cursor-init.js}"></script>

    <!-- 页脚 -->
    <div class="gateway-footer">
      <span>Powered by <a href="https://halo.run" target="_blank" rel="noopener" style="pointer-events:auto;color:inherit;text-decoration:none;">Halo</a></span>
      <span th:if="${theme.config.basic?.siteInfo?.author}" th:text="'Theme by ' + ${theme.config.basic.siteInfo.author}"></span>
    </div>
    <halo:footer />
  </body>
</html>
